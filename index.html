<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SANI CHESS — Шахматы</title><link rel="stylesheet" href="style.css"><link rel="icon" href="data:,">
</head><body>
<div class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark">♔</div><div><b>SANI CHESS</b><span>SMART • ONLINE • MODERN</span></div></div><div class="header-actions"><button class="head-btn" id="profileBtn" title="Профиль">👤</button><button class="head-btn" id="shopBtn" title="Магазин">🛍️</button><button class="head-btn" id="musicBtn" title="Музыка выключена">🔇</button><button class="head-btn" id="leaderBtn" title="Лидеры">🏆</button><button class="head-btn" id="adminBtn">🛡️</button><div class="status-pill" id="connection">● ВХОД</div></div></header>
<main class="home" id="home"><section class="hero"><div class="eyebrow">♟ SANI GROUP PRESENTS</div><h1>ШАХМАТЫ</h1><p>Классические шахматы с современным интерфейсом, игрой против компьютера и онлайн-матчами.</p></section><div class="menu-grid"><button class="mode-card featured" data-action="computer"><span class="icon">🤖</span><strong>ИГРАТЬ С КОМПЬЮТЕРОМ</strong><small>ИИ • 3 уровня сложности</small></button><button class="mode-card" data-action="online"><span class="icon">🌐</span><strong>ОНЛАЙН ИГРА</strong><small>Создать или подключиться к столу</small></button><button class="mode-card" data-action="local"><span class="icon">♟</span><strong>ДВА ИГРОКА</strong><small>Игра на одном устройстве</small></button><button class="mode-card" data-action="rules"><span class="icon">📖</span><strong>ПРАВИЛА ИГРЫ</strong><small>Полные правила SANI CHESS</small></button><button class="mode-card" data-action="about"><span class="icon">🏢</span><strong>О РАЗРАБОТЧИКАХ</strong><small>SANI GROUP • SANI CHESS</small></button><button class="mode-card store-card" id="shopHome" data-action="shop"><span class="icon">🛍️</span><strong>МАГАЗИН</strong><small>Доски • Фигуры • Фишки</small></button></div></main>
<section class="game" id="game" hidden><div class="game-top"><button class="back" id="back">← МЕНЮ</button><div class="game-title"><b id="gameMode">ШАХМАТЫ</b><span id="gameSub">Новая партия</span></div><div class="game-actions"><button id="newGame">НОВАЯ</button><button id="flip">↕ ДОСКА</button></div></div><div class="board-layout"><aside class="player-card black"><div class="avatar">♚</div><div><b id="blackName">Чёрные</b><span id="blackClock">10:00</span></div></aside><div class="board-wrap"><div class="board" id="board"></div><div class="promotion" id="promotion" hidden><div class="promotion-card"><b>ВЫБЕРИТЕ ФИГУРУ</b><div id="promoButtons"></div></div></div></div><aside class="side-panel"><div class="player-card white"><div class="avatar">♔</div><div><b id="whiteName">Белые</b><span id="whiteClock">10:00</span></div></div><div class="info-card"><b>ХОДЫ</b><div id="moves" class="moves"></div></div><div class="info-card"><b>СОСТОЯНИЕ</b><div id="message">Ваш ход</div></div><div class="game-buttons"><button id="hintBtn" class="vip-hint" hidden>💡 Подсказка</button><button id="resign">🏳 Сдаться</button><button id="drawOffer">🤝 Предложить ничью</button></div></aside></div><div class="online-bar" id="onlineBar" hidden><div><b id="roomLabel">Стол</b><span id="onlineState">Ожидание игрока…</span></div><div class="chat"><div id="chatLog"></div><div class="chat-input"><input id="chatInput" maxlength="160" placeholder="Сообщение…"><button id="sendChat">➤</button></div></div></div></section>
<div class="modal" id="modal" hidden><div class="modal-card"><button class="close" id="closeModal">×</button><div id="modalContent"></div></div></div>
<audio id="bgMusic" src="bg-music.mp3" preload="auto"></audio><script src="client.js?v=3.9.9"></script></body></html>
